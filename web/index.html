<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="description" content="Install FinTrack untuk mencatat pemasukan, pengeluaran, anggaran, dan melihat analisis keuangan.">
  <meta name="robots" content="noindex">
  <title>FinTrack — Install</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230e1116'/%3E%3Cpath d='M20 72 L40 50 L55 60 L80 30' fill='none' stroke='%2300e676' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --bg:#0e1116; --surface:#161b22; --line:#2a323d; --text:#f5f7fa; --muted:#a0a9b8; --green:#00e676; --indigo:#3f51b5; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body {
      min-height:100svh; display:grid; place-items:center; padding:24px;
      background:radial-gradient(ellipse at 50% 15%, rgba(63,81,181,.24), transparent 55%), var(--bg);
      color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    main { width:min(100%, 360px); display:flex; flex-direction:column; align-items:center; text-align:center; }
    .logo { width:88px; height:88px; margin-bottom:20px; border-radius:24px; box-shadow:0 14px 40px rgba(63,81,181,.22); }
    h1 { margin:0; font-size:30px; line-height:1.2; letter-spacing:-.8px; font-weight:750; }
    .tagline { margin:9px 0 30px; color:var(--muted); font-size:14px; line-height:1.6; }
    .install {
      display:flex; align-items:center; justify-content:center; gap:11px; width:100%; min-height:54px;
      padding:14px 20px; border-radius:15px; border:1px solid rgba(0,230,118,.22);
      background:var(--green); color:#04140b; text-decoration:none; font-size:15px; font-weight:750;
      box-shadow:0 8px 26px rgba(0,230,118,.13); transition:transform .15s ease, background .15s ease;
    }
    .install:hover { background:#33ee93; }
    .install:active { transform:scale(.985); }
    .install:focus-visible { outline:3px solid white; outline-offset:4px; }
    .install svg { width:20px; height:20px; flex:none; }
    @media (prefers-reduced-motion:reduce) { .install { transition:none; } }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 108 108" role="img" aria-label="Logo FinTrack">
      <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2230"/><stop offset="1" stop-color="#0e1116"/></linearGradient></defs>
      <rect width="108" height="108" rx="25" fill="url(#bg)"/>
      <path fill="#00E676" d="M34,68 L46,56 L58,62 L74,40 L74,48 L78,48 L78,34 L64,34 L64,38 L71.2,38 L57.8,56.4 L46.2,50.6 L31,65 L34,68 Z"/>
      <path fill="#5C6BC0" d="M30,72 h10 v8 h-10 z M46,64 h10 v16 h-10 z M62,54 h10 v26 h-10 z"/>
    </svg>
    <h1>FinTrack</h1>
    <p class="tagline">Kelola keuanganmu dengan lebih mudah.</p>
    <a class="install" href="./FinTrack.apk" download="FinTrack.apk" aria-label="Install FinTrack untuk Android">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
      Install FinTrack
    </a>
  </main>
</body>
</html>
